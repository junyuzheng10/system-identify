name: sysid
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # numerical
  - numpy>=1.22
  - scipy>=1.7
  # pinocchio (C++ 绑定)
  # 注意: 必须用 conda-forge 的 C++ 绑定，不能用 pip 装 PyPI 上同名的纯 Python 包
  # （version 0.x，无 buildModelFromUrdf 等动力学 API）。
  # eigenpy/hpp-fcl/urdfdom 等 C++ 依赖由 conda 根据 pinocchio 版本自动解析，
  # 不要手动指定版本以免冲突（此前 urdfdom=3.1.0 与 pinocchio=2.3.1 就因 .so 版本不匹配导致 import 失败）。
  - pinocchio=4.1.0
  # plotting
  - matplotlib>=3.5
  # data
  - pandas>=1.4
  # logging & utils
  - loguru>=0.5
  - pyyaml>=6.0
  # pip: 以可编辑模式安装本项目（自动拉取 setup.py 里的 install_requires）
  # meshcat: 3D 可视化（用于回放激励轨迹），PyPI 包，conda-forge 上较旧
  - pip:
    - meshcat
    - -e .
